# Builds the desktop app for Windows and macOS. Pushing a tag like v0.1.0 publishes both to a
# GitHub Release; running it by hand (Actions -> Desktop app -> Run workflow) only uploads them
# as build artifacts, for testing.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install ".[app]"

      - name: Test
        run: python -m unittest discover -s tests
        env:
          PYTHONPATH: src

      - name: Build
        run: pyinstaller --noconfirm packaging/elevator-sim.spec

      - name: Smoke test the build
        run: |
          ./dist/ElevatorSimulator --no-browser --port 8765 &
          pid=$!
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/ > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8765/ -o page.html
          grep -q 'id="view-import"' page.html
          curl -sf http://127.0.0.1:8765/samples/lookahead.json > /dev/null
          curl -sf http://127.0.0.1:8765/api/settings > /dev/null
          kill $pid || true

      - name: Package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ElevatorSimulator.exe -DestinationPath ElevatorSimulator-windows.zip

      - name: Package (macOS)
        if: matrix.platform == 'macos'
        # zip keeps the executable bit, so it still runs after unzipping.
        run: cd dist && zip ../ElevatorSimulator-macos.zip ElevatorSimulator

      - uses: actions/upload-artifact@v4
        with:
          name: ElevatorSimulator-${{ matrix.platform }}
          path: ElevatorSimulator-${{ matrix.platform }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" ElevatorSimulator-*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
